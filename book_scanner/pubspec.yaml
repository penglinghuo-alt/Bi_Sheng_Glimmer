name: book_scanner
description: "Book Scanner - Scan and print books with ease"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Device Communication
  flutter_blue_plus: ^1.34.5
  permission_handler: ^11.3.1

  # Camera & Image
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Storage & Preferences
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # Networking
  dio: ^5.4.1
  web_socket_channel: ^3.0.2
  mqtt_client: ^10.2.1

  # UI Enhancements
  shimmer: ^3.0.0
  animations: ^2.0.11
  flutter_animate: ^4.5.2
  record: ^7.1.1
  web: ^1.1.1

# flutter_plugin_android_lifecycle 2.0.35 编译于 android-36，而 file_picker 8.3.7 硬编码 compileSdk 34，
# 触发 checkDebugAarMetadata 失败。锁定到 2.0.24（compileSdk 34），与 file_picker 8.3.7 匹配。
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf